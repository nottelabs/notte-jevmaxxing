[project]
name = "notte-jev"
version = "0.1.0"
description = "Run jev-ultrafast on Notte browser sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "notte-sdk>=1.0",
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@452c1ad2dd628008f1d5608f28158d76e49e6cc0",
]

[project.scripts]
notte-jev = "notte_jev:main"
notte-jevmaxxing = "notte_jev:inspector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notte_jev"]

[tool.hatch.metadata]
allow-direct-references = true
